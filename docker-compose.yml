version: "3.9"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  mcp-server:
    build: .
    ports:
      - "8765:8765"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
    command: python -m app.mcp.server
